<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Гостиница</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <!-- Боковое меню -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">H</div>
            <div>
                <div class="logo-title">HOTEL</div>
                <div class="logo-subtitle">Система управления</div>
            </div>
        </div>

        <nav class="navigation">

            <button class="nav-link active" data-page="dashboard">
                <span class="nav-icon"></span>
                <span>Главная</span>
            </button>

            <!-- Доступно всем ролям -->
            <button class="nav-link" data-page="clients" data-roles="ADMIN,MANAGER,RECEPTIONIST">
                <span class="nav-icon">👤</span>
                <span>Клиенты</span>
            </button>

            <!-- Только Админ и Менеджер -->
            <button class="nav-link" data-page="rooms" data-roles="ADMIN,MANAGER">
                <span class="nav-icon">▣</span>
                <span>Номера</span>
            </button>

<!--            <button class="nav-link" data-page="room-details" data-roles="ADMIN,MANAGER">-->
<!--                <span class="nav-icon">▤</span>-->
<!--                <span>Детали номеров</span>-->
<!--            </button>-->

            <!-- Доступно всем ролям -->
            <button class="nav-link" data-page="registrations" data-roles="ADMIN,MANAGER,RECEPTIONIST">
                <span class="nav-icon">▧</span>
                <span>Регистрации</span>
            </button>

            <!-- Только Админ и Менеджер -->
            <button class="nav-link" data-page="payment-cards" data-roles="ADMIN,MANAGER">
                <span class="nav-icon">▤</span>
                <span>Платёжные карты</span>
            </button>

            <!-- Доступно всем ролям -->
            <button class="nav-link" data-page="services" data-roles="ADMIN,MANAGER,RECEPTIONIST">
                <span class="nav-icon">★</span>
                <span>Услуги</span>
            </button>

            <button class="nav-link" data-page="service-provisions" data-roles="ADMIN,MANAGER,RECEPTIONIST">
                <span class="nav-icon">✓</span>
                <span>Оказание услуг</span>
            </button>

            <!-- Только Админ и Менеджер -->
            <button class="nav-link" data-page="invoice-items" data-roles="ADMIN,MANAGER">
                <span class="nav-icon">▥</span>
                <span>Счета</span>
            </button>

            <!-- Только Администратор -->
            <button class="nav-link" data-page="employees" data-roles="ADMIN">
                <span class="nav-icon">👥</span>
                <span>Сотрудники</span>
            </button>

        </nav>

        <div class="sidebar-footer">
            <!-- Для неавторизованных -->
            <div id="guest-actions">
                <button class="btn btn-primary btn-block" onclick="openLoginModal()">
                    Войти
                </button>
            </div>

            <!-- Для авторизованных -->
            <div id="user-actions" style="display: none;">
                <div class="user-info" id="user-info"></div>
                <button class="btn btn-secondary btn-block" onclick="logout()">
                    Выйти
                </button>
            </div>
        </div>

    </aside>


    <!-- Основная часть -->
    <main class="main-content" id="main-content"></main>

</div>


<!-- Модальное окно -->
<div class="modal" id="modal">

    <div class="modal-content">

        <button class="modal-close" id="modal-close">
            ×
        </button>

        <div id="modal-body"></div>

    </div>

</div>


<!-- JS -->
<script src="js/api.js"></script>
<script src="js/validation.js"></script>
<script src="js/modal.js"></script>
<script src="js/crud.js"></script>
<script src="js/auth.js"></script>
<script src="js/employees.js"></script>
<script src="js/clients.js"></script>
<script src="js/rooms.js"></script>
<script src="js/room-details.js"></script>
<script src="js/registrations.js"></script>
<script src="js/payment-cards.js"></script>
<script src="js/services.js"></script>
<script src="js/service-provisions.js"></script>
<script src="js/invoice-items.js"></script>

<script src="js/app.js"></script>

</body>
</html>
